name: Main
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check_llms_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate LLM docs corpus
        run: node scripts/generate-llms-txt.mjs
      - name: Check committed llms artifacts are up to date
        run: |
          if ! git diff --exit-code -- docs/public/llms-full.txt docs/public/llms.txt; then
            echo "::error::LLM docs are out of date. Run 'pnpm docs:llms' and commit the result."
            exit 1
          fi

  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.15.1+sha512.1acb565e6193efbebda772702950469150cf12bcc764262e7587e71d19dc98a423dff9536e57ea44c49bdf790ff694e83c27be5faa23d67e0c033b583be4bfcf
        #   dest: # optional, default is ~/setup-pnpm
        #   run_install: # optional, default is null
        #   package_json_file: # optional, default is package.json
        #   standalone: # optional, default is false
      - name: Install dependencies
        run: pnpm install

      - name: Create .env file from secrets
        run: |
          echo "MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}" >> .env
          echo "GEOBASE_PROJECT_REF=${{ secrets.GEOBASE_PROJECT_REF }}" >> .env
          echo "GEOBASE_API_KEY=${{ secrets.GEOBASE_API_KEY }}" >> .env
          echo "TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }}" >> .env

      - name: Build
        run: pnpm build
      - name: Clear Hugging Face ONNX cache
        run: |
          find node_modules -type d -path '*/@huggingface/transformers/.cache' -prune -exec rm -rf {} +
          rm -rf cache
      - name: Test
        timeout-minutes: 20
        run: pnpm test
